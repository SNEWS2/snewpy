[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snewpy"
dynamic = ["version"]
description = "A Python package for working with supernova neutrinos"
authors = [{ name = "SNEWS Collaboration", email = "snews2.0@lists.bnl.gov" }]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
readme = {file = "README.md", content-type = "text/markdown"}

requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "astropy >= 4.3",
    "astropy-healpix >= 1.1; platform_system == 'Windows'",
    "healpy; platform_system != 'Windows'",
    "pandas",
    "tqdm",
    "matplotlib",
    "h5py",
    "requests",
    "pyyaml",
    "snowglobes_data == 1.3.2"
]

[project.optional-dependencies]
dev = ["hypothesis", "pytest", "nbval"]
docs = ["numpydoc", "nbsphinx", "ipykernel", "tqdm[notebook]"]

[project.urls]
"Homepage" = "https://github.com/SNEWS2/snewpy"
"Bug Tracker" = "https://github.com/SNEWS2/snewpy/issues"


[tool.setuptools.dynamic]
version = {attr = "snewpy.__version__"}

[tool.setuptools.packages.find]
where = ["python"]
include = [
    "snewpy",
    "snewpy.*",
]
exclude = [
    "snewpy.scripts",
]

[tool.setuptools.package-data]
"snewpy.models" = ["*.yml"]
